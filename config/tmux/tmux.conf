# True color inside tmux (Alacritty sets TERM=alacritty)
set -g default-terminal "tmux-256color"
set -as terminal-features ",alacritty*:RGB"

# No delay after Esc (otherwise nvim mode switches lag)
set -sg escape-time 0
set -g focus-events on

set -g mouse on
set -g history-limit 50000
setw -g mode-keys vi

# Windows and panes start at 1, matching the keyboard row
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Splits and new windows open in the current directory
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

bind r source-file ~/.config/tmux/tmux.conf \; display "reloaded"

# Status bar in bathory colors
set -g status-style "bg=default,fg=#c1c1c1"
set -g window-status-current-style "fg=#5f8787,bold"
set -g pane-active-border-style "fg=#5f8787"
set -g pane-border-style "fg=#505050"
